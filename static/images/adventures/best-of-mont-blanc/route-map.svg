<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Best of Mont Blanc route compared with the full circuit</title>
  <desc id="desc">Solid coral lines show proposed runs from Les Contamines to Les Chapieux, Courmayeur, Rifugio Bonatti and La Fouly, plus the Lac Blanc finale. Dashed blue lines show the La Fouly to Chamonix vehicle transfer and Flégère access. Gray dotted lines show full Tour du Mont Blanc sections omitted from this plan through Champex, Trient, Col de Balme, Les Houches and Col du Tricot.</desc>
