<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Geographic overview of the Nakasendo route from Magome to Nagiso</title>
  <desc id="desc">A coordinate-grounded planning map showing Magome, Magome Pass, the waterfalls, Ichikokutochi tea house, Tsumago and Nagiso Station.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3ead8"/><stop offset="1" stop-color="#dce7d8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d2924" flood-opacity=".14"/></filter>
    <pattern id="contours" width="92" height="72" patternUnits="userSpaceOnUse"><path d="M-20 50C10 10 56 10 104 44" fill="none" stroke="#435b4a" stroke-opacity=".08" stroke-width="2"/><path d="M-10 68C24 30 64 30 110 62" fill="none" stroke="#435b4a" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#paper)"/>
  <rect width="1200" height="680" rx="28" fill="url(#contours)"/>
  <path d="M116 572C252 550 282 460 388 414C468 380 488 326 574 286C664 244 730 252 798 186C846 140 944 128 1068 90" fill="none" stroke="#fdf9ef" stroke-width="44" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M116 572C252 550 282 460 388 414C468 380 488 326 574 286C664 244 730 252 798 186C846 140 944 128 1068 90" fill="none" stroke="#b45132" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 22"/>
  <path d="M798 186C840 222 890 272 952 304C1008 334 1048 382 1080 456" fill="none" stroke="#365c4c" stroke-width="9" stroke-linecap="round" stroke-dasharray="18 13"/>
  <path d="M1018 42C1000 178 1040 290 1016 418C1008 468 1026 526 1094 620" fill="none" stroke="#86a9b1" stroke-width="26" stroke-linecap="round" opacity=".48"/>
  <g font-family="Arial, sans-serif" fill="#24352d">
    <text x="76" y="75" font-family="Georgia, serif" font-size="34">The Kiso Road, village to station</text>
    <text x="78" y="112" font-size="17" fill="#5f6a64">Geographic overview · north is up · not a navigation track</text>
    <g transform="translate(116 572)"><circle r="19" fill="#b45132"/><circle r="7" fill="#fff"/><text x="28" y="-12" font-size="26" font-family="Georgia, serif">Magome-juku</text><text x="28" y="16" font-size="15" fill="#5f6a64">馬籠宿 · Day 1</text></g>
    <g transform="translate(388 414)"><circle r="14" fill="#b45132"/><circle r="5" fill="#fff"/><text x="24" y="-10" font-size="21" font-family="Georgia, serif">Magome Pass</text><text x="24" y="15" font-size="14" fill="#5f6a64">790 m · highest point</text></g>
    <g transform="translate(574 286)"><circle r="12" fill="#b45132"/><circle r="4" fill="#fff"/><text x="22" y="-8" font-size="19" font-family="Georgia, serif">O-daki / Me-daki</text><text x="22" y="14" font-size="13" fill="#5f6a64">男滝・女滝 · waterfalls</text></g>
    <g transform="translate(694 246)"><circle r="11" fill="#b45132"/><circle r="4" fill="#fff"/><text x="18" y="38" font-size="18" font-family="Georgia, serif">Ichikokutochi</text><text x="18" y="59" font-size="13" fill="#5f6a64">一石栃立場茶屋 · tea stop</text></g>
    <g transform="translate(798 186)"><circle r="19" fill="#b45132"/><circle r="7" fill="#fff"/><text x="24" y="-16" font-size="26" font-family="Georgia, serif">Tsumago-juku</text><text x="24" y="14" font-size="15" fill="#5f6a64">妻籠宿 · Night 2</text></g>
    <g transform="translate(1080 456)"><circle r="19" fill="#365c4c"/><circle r="7" fill="#fff"/><text x="-250" y="-6" font-size="26" font-family="Georgia, serif">Nagiso Station</text><text x="-250" y="22" font-size="15" fill="#5f6a64">南木曽駅 · train to Tokyo</text></g>
    <g transform="translate(78 612)"><line x1="0" x2="42" y1="0" y2="0" stroke="#b45132" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18"/><text x="56" y="6" font-size="14">Nakasendō walk · about 8 km / 5 mi</text><line x1="360" x2="410" y1="0" y2="0" stroke="#365c4c" stroke-width="8" stroke-dasharray="18 12"/><text x="424" y="6" font-size="14">Tsumago → Nagiso · about 3.7 km / 2.3 mi</text></g>
  </g>
</svg>
